name = "webycash-cf-container-rgb-collectible"
main = "src/index.ts"
compatibility_date = "2026-06-01"
account_id = "REPLACE_ME"

[[d1_databases]]
binding = "WEBYCASH_D1"
database_name = "webycash-cf-container-rgb-collectible-testnet"
database_id = "REPLACE_ME_AFTER_d1_create"
migrations_dir = "../../migrations"

[[containers]]
class_name = "RgbCollectibleContainer"
image = "../../../../Dockerfile.cf-rgb-collectible"
instance_type = "basic"
max_instances = 4

[durable_objects]
bindings = [
  { name = "WEBYCASH_CONTAINER", class_name = "RgbCollectibleContainer" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RgbCollectibleContainer"]

[vars]
WEBCASH_MODE = "testnet"
# Issuer keys for /api/v1/issue: set via `wrangler secret put` in production.

[env.production.vars]
WEBCASH_MODE = "production"

[[env.production.d1_databases]]
binding = "WEBYCASH_D1"
database_name = "webycash-cf-container-rgb-collectible-production"
database_id = "REPLACE_ME_AFTER_d1_create"
migrations_dir = "../../migrations"

[[env.production.containers]]
class_name = "RgbCollectibleContainer"
image = "../../../../Dockerfile.cf-rgb-collectible"
instance_type = "standard"
max_instances = 16

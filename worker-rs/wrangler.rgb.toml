name = "webycash-rgb-dev"
main = "build/worker/shim.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "worker-build --release -- --no-default-features --features rgb"

[[d1_databases]]
binding = "DB"
database_name = "webycash-cf-rgb-dev"
database_id = "a5a06134-7282-4839-88aa-a99dbce25a1d"

[[routes]]
pattern = "rgb.dev.weby.cash"
custom_domain = true

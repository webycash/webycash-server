[workspace]
resolver = "2"

# Default cargo build builds only the Webcash binary. The other rails are
# opt-in by explicit -p selection:
#
#   cargo build                              → server-webcash (default)
#   cargo build -p webycash-server-rgb       → adds RgbFungible binary
#   cargo build -p webycash-server-rgb-collectible → adds RgbCollectible binary
#   cargo build -p webycash-server-voucher   → adds Voucher binary
#   cargo build -p referee                   → adds the referee binary
#                                              (Webcash ↔ ARK swap helper;
#                                              docs/referee-zkp-based-swap.md §4)
#   cargo build --workspace                  → builds everything
#
# Library sub-crates (proto, asset-core, auth, storage, compute, mining,
# asset-webcash, asset-rgb, asset-voucher, server-core) are inlined as modules
# of the root "." crate via #[path] — their Cargo.toml files are deleted so
# cargo packaging can pick up the source trees.
# aluvm-runtime is a SEPARATE published crate (webylib WASM client-side only;
# the server uses pure-Rust HTLC predicates and never runs AluVM).
default-members = ["crates/server-webcash"]

members = [
    # Root published library crate (inlines 10 sub-crate source trees)
    ".",
    # Published separately — WASM client-side AluVM runtime for webylib
    "crates/aluvm-runtime",
    # Legacy monolithic server (ractor-based; workspace-only, publish = false)
    "crates/server",
    # Proc-macro helper (workspace-only, publish = false)
    "crates/macros",
    # Flavor binaries (workspace-only, publish = false). Each binary is a
    # plain Linux server (hyper + tokio). For Cloudflare deployment the
    # same binary runs inside a Cloudflare Container — see
    # `deploy/cloudflare-container/`.
    "crates/server-webcash",
    "crates/server-rgb",
    "crates/server-rgb-collectible",
    "crates/server-voucher",
    # Wire-format conformance test suite (workspace-only, publish = false)
    "crates/conformance",
    # Webcash ↔ Bitcoin ARK swap helper (workspace-only, publish = false)
    "referee",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Webycash Developers"]
repository = "https://github.com/webycash/webycash-server"

[workspace.dependencies]
# HTTP (hyper only — no actix-web)
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http2"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Actor framework (ractor — Erlang-inspired, native tokio)
ractor = "0.12"

# Parser combinators
nom = "7"

# Crypto
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
hmac = "0.12"

# Databases
aws-config = "1"
aws-sdk-dynamodb = "1"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
foundationdb = { version = "0.10", features = ["embedded-fdb-include", "fdb-7_3"] }
# Native rusqlite test double for the WorkerProxyStore (dev-only); the
# in-process tests stand in for D1 by serving the same SQL dialect.
rusqlite = { version = "0.32", features = ["bundled"] }
# HTTP client the WorkerProxyStore uses from inside the Cloudflare
# Container to call back to the Worker that holds the D1 binding.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Proc macros
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
quote = "1"
proc-macro2 = "1"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
tokio-stream = "0.1"

# Testing
proptest = "1"

# Published crates
webycash-server = { path = ".", version = "0.3.3", default-features = false }
webycash-aluvm-runtime = { path = "crates/aluvm-runtime" }

# Internal crates (workspace-only, not published)
webycash-macros = { path = "crates/macros" }

# ─────────────────────────────────────────────────────────────────────────────
# Root published crate (webycash-server library)
# ─────────────────────────────────────────────────────────────────────────────

[package]
name = "webycash-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "webycash server library — asset-gated ledger (webcash, RGB, voucher) with Redis / DynamoDB / FoundationDB / Cloudflare-D1 (via Worker proxy) backends"
documentation = "https://docs.rs/webycash-server"
keywords = ["webcash", "payments", "bearer-cash", "rgb", "ledger"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
include = [
    "src/**/*.rs",
    "crates/proto/src/**/*.rs",
    "crates/asset-core/src/**/*.rs",
    "crates/auth/src/**/*.rs",
    "crates/storage/src/**/*.rs",
    "crates/compute/src/**/*.rs",
    "crates/mining/src/**/*.rs",
    "crates/asset-webcash/src/**/*.rs",
    "crates/asset-rgb/src/**/*.rs",
    "crates/asset-voucher/src/**/*.rs",
    "crates/server-core/src/**/*.rs",
    "LICENSE",
    "README.md",
]

[lib]
name = "webycash_server"
path = "src/lib.rs"

[features]
default = ["webcash", "redis"]
webcash = []
rgb = []
rgb-runtime = ["rgb", "dep:strict_types"]
voucher = []
openpgp = ["dep:pgp"]
redis = ["dep:redis"]
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb", "dep:serde_dynamo"]
fdb = ["dep:foundationdb"]
redis-fdb = ["redis", "fdb"]
# Cloudflare Containers + D1 backend. The native server binary runs inside
# a Cloudflare Container and reaches D1 by HTTP-calling a thin TS Worker
# that holds the D1 binding. Wire format defined in
# `deploy/cloudflare-container/workers/{flavor}/src/index.ts`.
worker-proxy = ["dep:reqwest"]

[dependencies]
# Core shared
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
nom = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }

# Async + logging
futures = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }

# Server runtime + HTTP — native-only. The hyper/tokio/ractor stack runs on a
# real Linux host (bare metal, container, AWS Lambda). For the Cloudflare
# Workers (workers-rs/wasm32) target these are gated out below; the
# runtime-neutral `route_proto*` handlers + the D1 LedgerStore (in the
# `worker-rs/` crate) carry the wasm path. See [target.'cfg(...)'] sections.

# Optional: OpenPGP V4 cert parsing in auth module
pgp = { version = "0.19", optional = true }

# Optional: strict-types for RGB v2 contract schema (rgb-runtime feature)
strict_types = { version = "2.9", optional = true }

# Optional storage backends
redis = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
serde_dynamo = { workspace = true, optional = true }
foundationdb = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

# Native target (everything that is NOT wasm32): the full hyper/tokio/ractor
# server runtime. The native flavor binaries + Container path use these.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
ractor = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

# wasm32 target (Cloudflare Workers via the worker-rs crate): no server
# runtime; only tokio's runtime-free `sync` primitives (NonceCache etc.).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Direct (NOT `workspace = true`): the workspace tokio is `features=["full"]`,
# which `workspace=true` would inherit (pulling `net`→`mio`, unsupported on
# wasm). wasm needs only the runtime-free `sync` primitives.
tokio = { version = "1", default-features = false, features = ["sync"] }
# wasm32 entropy: uuid v4 + the curve25519/ed25519 dep tree need a getrandom
# js backend; uuid additionally needs its own `js` feature.
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = { workspace = true }
# rusqlite test double for the d1 backend (native cfg(test) only)
rusqlite = { workspace = true }
# Test-only RNG for the openpgp-gated round-trip test in `auth`.
rand = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
